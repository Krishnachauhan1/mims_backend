# Deploy Laravel API → https://powerforceindustries.com/api
#
# Repo: https://github.com/Krishanchauhan1/mims_backend
#
# Deploy uses SSH (port 65002), not FTP. FTP secrets are only aliases for host/user/password.
#
# Set ONE auth method:
#   A) SSH_PRIVATE_KEY — deploy key (recommended for CI)
#   B) SSH_PASSWORD or FTP_PASSWORD — same password you use for: ssh -p 65002 u683672103@145.79.58.104
#
# Host / user (any one naming works):
#   SSH_HOST or FTP_SERVER     — 145.79.58.104  (ftp:// prefix is stripped)
#   SSH_USERNAME or FTP_USERNAME — u683672103
#
# Optional:
#   SSH_PORT         — default 65002 (not FTP port 21)
#   SSH_REMOTE_DIR   — default domains/powerforceindustries.com/public_html

name: Backend CI/CD (Hostinger)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: backend-hostinger-${{ github.ref }}
  cancel-in-progress: true

env:
  SSH_PORT: "65002"
  SSH_REMOTE_DIR: domains/powerforceindustries.com/public_html
  PHP_VERSION: "8.4"

jobs:
  quality:
    name: Composer & Laravel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, curl, zip, sqlite3, pdo_sqlite, bcmath, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Prepare app key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Migrate (sqlite) & route list
        run: |
          php artisan migrate --force --no-interaction
          php artisan route:list --no-interaction

  deploy:
    name: Deploy to Hostinger
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT || env.SSH_PORT }}
        run: |
          set -e
          HOST="${SSH_HOST:-$FTP_SERVER}"
          HOST="${HOST#ftp://}"
          HOST="${HOST#http://}"
          HOST="${HOST#https://}"
          USER="${SSH_USERNAME:-$FTP_USERNAME}"
          PASS="${SSH_PASSWORD:-$FTP_PASSWORD}"
          SSH_PORT="${SSH_PORT:-65002}"
          if [ "$SSH_PORT" = "21" ]; then
            echo "::warning::SSH_PORT was 21 (FTP). Using Hostinger SSH port 65002."
            SSH_PORT="65002"
          fi

          if [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::Set SSH_HOST + SSH_USERNAME (or FTP_SERVER + FTP_USERNAME)."
            exit 1
          fi

          echo "DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$SSH_PORT" >> "$GITHUB_ENV"
          echo "DEPLOY_SYNC=tar" >> "$GITHUB_ENV"

          ssh-keyscan -p "$SSH_PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            echo "DEPLOY_RSYNC_RSH=ssh -i ~/.ssh/id_deploy -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
            echo "Using SSH key authentication."
          elif [ -n "$PASS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            echo "DEPLOY_SSHPASS=$PASS" >> "$GITHUB_ENV"
            echo "DEPLOY_RSYNC_RSH=sshpass -e ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
            echo "Using SSH password authentication."
          else
            echo "::error::Set SSH_PRIVATE_KEY or SSH_PASSWORD (or FTP_PASSWORD if same as SSH login)."
            exit 1
          fi

      - name: Upload application (tar+ssh, no vendor / .env)
        env:
          SSH_HOST: ${{ env.DEPLOY_HOST }}
          SSH_USERNAME: ${{ env.DEPLOY_USER }}
          SSH_PORT: ${{ env.DEPLOY_PORT }}
          REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR || env.SSH_REMOTE_DIR }}
          DEPLOY_SYNC: ${{ env.DEPLOY_SYNC }}
          RSYNC_RSH: ${{ env.DEPLOY_RSYNC_RSH }}
          SSHPASS: ${{ env.DEPLOY_SSHPASS }}
        run: bash deploy/ci-hostinger.sh sync

      - name: Composer, migrate, cache on server
        env:
          SSH_HOST: ${{ env.DEPLOY_HOST }}
          SSH_USERNAME: ${{ env.DEPLOY_USER }}
          SSH_PORT: ${{ env.DEPLOY_PORT }}
          REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR || env.SSH_REMOTE_DIR }}
          RSYNC_RSH: ${{ env.DEPLOY_RSYNC_RSH }}
          SSHPASS: ${{ env.DEPLOY_SSHPASS }}
        run: bash deploy/ci-hostinger.sh postdeploy

      - name: Verify live health endpoint
        run: |
          sleep 3
          curl -4 -sf -H "Accept: application/json" https://powerforceindustries.com/api/health
